# Combine with compose.yaml and any storage overrides.
services:
  web:
    ports: !override
      - target: 3000
        published: "${SEEDBENCH_PORT:-3000}"
        host_ip: "${SEEDBENCH_LAN_ADDRESS:?Set the private LAN address}"
        protocol: tcp
      - target: 3000
        published: "${SEEDBENCH_PORT:-3000}"
        host_ip: "${SEEDBENCH_TAILSCALE_ADDRESS:?Set the Tailscale address}"
        protocol: tcp
