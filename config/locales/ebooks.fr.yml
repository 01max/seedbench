fr:
  ebooks:
    errors:
      payload_changed: "Le fichier est inaccessible ou son empreinte a changé. Vérifiez le stockage et réimportez le fichier d’origine."
      resource_limit: "Inspection interrompue : limite de temps, mémoire ou taille dépassée. Vérifiez le fichier avant de réessayer."
      parser_failed: "Le lecteur n’a pas pu terminer l’inspection. Réessayez ou vérifiez le fichier avec un lecteur indépendant."
