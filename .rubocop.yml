inherit_gem:
  rubocop-rails-omakase: rubocop.yml

require:
  - ./config/rubocop/private_class_helpers.rb
  - ./config/rubocop/localized_messages.rb

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - private/**/*
    - tmp/**/*
    - vendor/**/*

Lint:
  Enabled: true
Security:
  Enabled: true
Rails:
  Enabled: true
Performance:
  Enabled: true
RSpec:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: single_quotes
  Include:
    - '**/*.rb'
    - '**/*.rake'
    - Gemfile
    - Rakefile
    - config.ru
    - bin/rubocop
    - script/quality/verify_lint
    - script/quality/verify_coverage

Style/AccessModifierDeclarations:
  EnforcedStyle: group

Rails/I18nLocaleTexts:
  Enabled: true

Seedbench/PrivateClassHelpers:
  Enabled: true

Seedbench/LocalizedMessages:
  Enabled: true
  Include: [app/**/*.rb, lib/**/*.rb]

Metrics/MethodLength:
  Enabled: true
  Max: 15
  Include: [app/**/*.rb, lib/**/*.rb]
Metrics/AbcSize:
  Enabled: true
  Max: 20
  Include: [app/**/*.rb, lib/**/*.rb]
Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 7
  Include: [app/**/*.rb, lib/**/*.rb]
Metrics/PerceivedComplexity:
  Enabled: true
  Max: 8
  Include: [app/**/*.rb, lib/**/*.rb]

# Integration examples keep one action and its related contract assertions together.
RSpec/MultipleExpectations:
  Max: 5
RSpec/ExampleLength:
  Max: 15
